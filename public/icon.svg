<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Divine Office book with a gold cross</title>

  <!-- The cover is the tile: full-bleed, opaque, and safe for launcher masks. -->
  <rect width="512" height="512" fill="#5c4a33"/>

  <!-- Minimal spine shading and a gold page edge keep the book silhouette legible. -->
  <rect width="52" height="512" fill="#493a28"/>
  <rect x="52" width="8" height="512" fill="#4f3e2b"/>
  <rect x="488" width="24" height="512" fill="#c9a961"/>
  <rect x="488" width="5" height="512" fill="#a8893c"/>

  <!-- Both cross layers remain inside the central r=205 px maskable safe circle. -->
  <path d="M228 104h56v98h64v56h-64v150h-56V258h-64v-56h64z"
        fill="#a8893c" transform="translate(6 6)"/>
  <path d="M228 104h56v98h64v56h-64v150h-56V258h-64v-56h64z"
        fill="#c9a961"/>
</svg>
