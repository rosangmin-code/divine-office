name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    # ⚠ 이 name 은 Vercel Deployment Checks 에 등록되는 문자열. 바꾸면 대시보드 재등록 필요.
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 런타임 의존성(devDeps 제외)의 critical 만 하드 게이트. P0-4 (next 16.3.5)
      # 로 critical 은 0 이고, 잔여는 pdfjs-dist high 1건(GHSA-hq66-cqwq-w95j,
      # fix 는 6.x major)뿐이다. pdfjs-dist 6.x 이관(라이브러리 + public/
      # pdf.worker.min.mjs legacy worker 사본 동시 교체 + sw.js CACHE_VERSION
      # bump) 후 `--audit-level=high` 로 올릴 것.
      - name: npm audit (runtime deps, critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      # src/app/__tests__/global-font-family.test.ts 는 vitest 안에서
      # chromium.launch() 로 실제 브라우저를 띄워 computed font-family 를
      # 검증한다 (유닛 스위트 110개 중 유일). 브라우저가 없으면 이 파일만
      # "Executable doesn't exist" 로 실패하므로 Vitest 앞에 설치가 필요하다.
      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Vitest
        run: npm test

      - name: Traceability matrix drift check
        run: node scripts/generate-test-fr-map.mjs --check

      # 읽기 전용 데이터 verifier 14종 (phrase-coverage NFR-009j 포함).
      # parsed_data/full_pdf.txt 는 gitignore 라 CI 에 없다 — PDF-anchored 3종
      # (rubric-coverage / seasonal-antiphons / ref-consistency) 은 러너가
      # "SKIP (SoT absent)" 로 통과시킨다. 로컬에서는 전부 실행됨.
      - name: Data verifiers (npm run verify:all)
        run: npm run verify:all

      # tsc 뒤에 두어 .next/dev/types 로 인한 거짓 tsc 실패(memory:
      # stale-next-types) 를 피한다. 산출물은 e2e job 이 `next start` 로 서빙.
      - name: Next build
        run: npm run build

      - name: Upload .next for e2e
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache/
          retention-days: 1
          if-no-files-found: error
          # `.next/` 는 dot-directory 라 upload-artifact 기본 설정(include-hidden-files:
          # false) 에서는 통째로 제외되어 "No files were found" 로 실패한다 (첫 CI
          # 실행 34790616912 에서 실증). 명시적으로 켠다.
          include-hidden-files: true

  e2e:
    # ⚠ Vercel Deployment Checks 등록 문자열 #2. (기존 "Playwright API smoke" 에서 개명)
    name: Playwright · API smoke + core UI
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Download .next
        uses: actions/download-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          path: .next

      # playwright.config.ts 가 CI 에서는 `next start --port 3200` 를 webServer 로
      # 띄운다 (프로덕션과 동일 경로). api.spec + 핵심 UI 5 spec
      # (prayer-sections · page-references · pwa · calendar-list-month · prayer-footer).
      - name: Core e2e (API smoke + 5 UI specs, chromium + mobile-chrome)
        run: npm run test:e2e:core

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
